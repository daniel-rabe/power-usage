name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Self-test (loads Qt, pyqtgraph and, on Windows, LibreHardwareMonitorLib through pythonnet)
        run: python -m powerwidget selftest
        env:
          QT_QPA_PLATFORM: offscreen

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[nvidia]" pyinstaller
      - name: Build PowerWidget.exe
        run: python packaging/build_exe.py
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PowerWidget.exe -ArgumentList "selftest","--output","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Error "no self-test output" }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\PowerWidget.exe -Algorithm SHA256).Hash.ToLower() + "  PowerWidget.exe" | Out-File -Encoding ascii dist\PowerWidget.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PowerWidget-windows
          path: |
            dist/PowerWidget.exe
            dist/PowerWidget.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowerWidget-windows
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" PowerWidget.exe PowerWidget.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
