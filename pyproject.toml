[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerwidget"
version = "0.1.0"
description = "Track and log the power usage of a Windows desktop PC"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "PySide6-Essentials>=6.6", "pyqtgraph>=0.13.7"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
dev = ["pytest>=8"]

[project.scripts]
powerwidget = "powerwidget.cli:main"

[tool.setuptools.packages.find]
include = ["powerwidget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
