[project]
name = "powerwidget"
version = "0.1.0"
description = "Track and log the power usage of a Windows desktop PC"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
dev = ["pytest>=8"]

[project.scripts]
powerwidget = "powerwidget.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
